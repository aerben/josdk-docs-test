# Workflow for building and deploying a versioned Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build test-index-processor and generate test documentation
        run: |
          ./mvnw clean install -DskipTests
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Node.js dependencies
        working-directory: ./docs
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
          npm install -D autoprefixer
          npm install -D postcss-cli
          npm install -D postcss
      - name: Build latest docs
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: America/Los_Angeles
        working-directory: ./docs
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Build versioned docs
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: America/Los_Angeles
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"

          # Each entry is "git-tag:version-label"
          # Update these when releasing new minor versions.
          VERSIONS=("v5.3.3:v5.3" "v5.2.3:v5.2" "v5.1.5:v5.1" "v5.0.5:v5.0")

          # Version dropdown entries shared by all versioned builds
          read -r -d '' VERSIONS_TOML << 'TOML_EOF' || true

          # Version entries for the version selector dropdown.
          [[params.versions]]
            version = "latest"
            url = "https://javaoperatorsdk.io/"

          [[params.versions]]
            version = "v5.3"
            url = "https://javaoperatorsdk.io/v5.3/"

          [[params.versions]]
            version = "v5.2"
            url = "https://javaoperatorsdk.io/v5.2/"

          [[params.versions]]
            version = "v5.1"
            url = "https://javaoperatorsdk.io/v5.1/"

          [[params.versions]]
            version = "v5.0"
            url = "https://javaoperatorsdk.io/v5.0/"
          TOML_EOF

          for entry in "${VERSIONS[@]}"; do
            TAG="${entry%%:*}"
            LABEL="${entry##*:}"
            echo "::group::Building docs for ${LABEL} (from tag ${TAG})"

            WORKDIR="/tmp/docs-${LABEL}"
            mkdir -p "${WORKDIR}"

            # Extract docs directory from the tagged version
            git archive "${TAG}" -- docs/ | tar -x -C "${WORKDIR}"

            # Copy node_modules for PostCSS (shared across all builds)
            cp -r docs/node_modules "${WORKDIR}/docs/" 2>/dev/null || true

            # Patch hugo.toml for archived version
            HUGO_TOML="${WORKDIR}/docs/hugo.toml"
            sed -i 's/^version = .*/version = "'"${LABEL}"'"/' "${HUGO_TOML}"
            sed -i 's/^archived_version = .*/archived_version = true/' "${HUGO_TOML}"

            # Append version dropdown entries
            echo "${VERSIONS_TOML}" >> "${HUGO_TOML}"

            # Build Hugo for this version
            hugo \
              --source "${WORKDIR}/docs" \
              --gc \
              --minify \
              --baseURL "${BASE_URL}/${LABEL}/"

            # Move output into the latest build's public directory as a subdirectory
            mv "${WORKDIR}/docs/public" "docs/public/${LABEL}"

            # Clean up
            rm -rf "${WORKDIR}"

            echo "::endgroup::"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
